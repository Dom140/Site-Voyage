version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voyage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carnet_user
      POSTGRES_PASSWORD: mon_mot_de_passe_securise
      POSTGRES_DB: carnet_voyage
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - voyage-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: voyage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voyage.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_secu
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - voyage-net

  web:
    build: ./backend
    container_name: voyage_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/public:/app/public   # <--- On lie uniquement le dossier des fichiers statiques
    environment:
      - DATABASE_URL=postgresql://carnet_user:mon_mot_de_passe_securise@db:5432/carnet_voyage
    depends_on:
      - db
    networks:
      - voyage-net

networks:
  voyage-net:
    driver: bridge