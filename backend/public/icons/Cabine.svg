<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fond circulaire (Même rond noir/sombre que le bus) -->
  <circle cx="256" cy="256" r="240" fill="#1E293B" />

  <!-- Cabine de bateau couchette (Violet) -->
  <g fill="#A855F7">
    <!-- Hublot (Fenêtre ronde du bateau) -->
    <circle cx="256" cy="115" r="32" />
    <circle cx="256" cy="115" r="22" fill="#1E293B" />

    <!-- Structuration de la cabine (Murs extérieurs) -->
    <path d="M 120 170 C 120 160, 128 150, 140 150 L 372 150 C 384 150, 392 160, 392 170 L 392 390 C 392 400, 384 410, 372 410 L 140 410 C 128 410, 120 400, 120 390 Z" />

    <!-- Découpe intérieure de la cabine (Transparence/Fond) -->
    <rect x="136" y="166" width="240" height="230" rx="8" fill="#1E293B" />

    <!-- Couchette du haut (Lit superposé supérieur) -->
    <!-- Structure du lit -->
    <rect x="150" y="215" width="212" height="12" rx="4" />
    <!-- Oreiller -->
    <rect x="160" y="195" width="36" height="20" rx="6" />
    <!-- Matelas/Couverture -->
    <rect x="196" y="205" width="160" height="10" rx="3" />

    <!-- Echelle d'accès -->
    <rect x="330" y="215" width="8" height="150" rx="4" />
    <rect x="348" y="215" width="8" height="150" rx="4" />
    <!-- Echelons -->
    <rect x="330" y="245" width="26" height="6" rx="2" />
    <rect x="330" y="280" width="26" height="6" rx="2" />
    <rect x="330" y="315" width="26" height="6" rx="2" />

    <!-- Couchette du bas (Lit superposé inférieur) -->
    <!-- Structure du lit -->
    <rect x="150" y="350" width="212" height="12" rx="4" />
    <!-- Oreiller -->
    <rect x="160" y="330" width="36" height="20" rx="6" />
    <!-- Matelas/Couverture -->
    <rect x="196" y="340" width="160" height="10" rx="3" />
  </g>
</svg>