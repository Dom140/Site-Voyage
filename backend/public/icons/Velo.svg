    <!-- Selle -->
    <path d="M 210 195 L 240 195" stroke-width="20" />
    <path d="M 195 195 L 245 195" stroke-width="16" />
  </g>

  <!-- Pédalier & Pédale -->
  <circle cx="235" cy="300" r="14" fill="#38BDF8" />
  <line x1="235" y1="300" x2="250" y2="320" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <line x1="240" y1="325" x2="260" y2="325" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />
</svg>