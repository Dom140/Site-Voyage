             L 225 195 
             L 325 195 
             L 235 300 
             Z" stroke-width="18" />

    <path d="M 160 300 L 235 300" stroke-width="18" />
    <path d="M 352 300 L 320 170" stroke-width="18" />

    <!-- Guidon -->
