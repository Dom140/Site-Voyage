<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fond circulaire (#1E293B) -->
  <circle cx="256" cy="256" r="240" fill="#1E293B" />

  <!-- Vélo minimaliste 2D (#38BDF8) -->
